server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Fixture for the web authentication test: BASIC, one fixed account.
    location /secured/ {
        auth_basic "e2e-secured";
        auth_basic_user_file /etc/nginx/e2e.htpasswd;
    }
}
